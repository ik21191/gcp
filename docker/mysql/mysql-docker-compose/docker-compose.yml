version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: mysql_container
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: my_db
      MYSQL_USER: user
      MYSQL_PASSWORD: 12345678
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
