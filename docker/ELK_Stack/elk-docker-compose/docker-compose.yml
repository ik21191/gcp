services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
    container_name: eelasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - es_network

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.28
    container_name: kibana
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200 # Point Kibana to the Elasticsearch node 
    ports:
      - "5601:5601" # Expose Kibana on port 5601
    networks:
      - es_network
    depends_on:
      - elasticsearch # Ensure Elasticsearch starts before Kibana
      
  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.28
    container_name: logstash
    restart: always
    volumes:
      #- ./logstash/config/:/usr/share/logstash/config # Mount the volume with Logstash configuration
      - ./logstash/config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro # Mount the volume for pipeline configuration
      - ./spring/spring.log:/my-log/spring.log # The Elasticsearch index will fetch data from this file.
    ports:
      - "5044:5044"
      - "9600:9600"
    environment:
      - xpack.monitoring.enabled=false
    networks:
      - es_network
    depends_on:
      - elasticsearch
      
volumes:
  es_data:
    driver: local
  

networks:
  es_network:
    driver: bridge    
