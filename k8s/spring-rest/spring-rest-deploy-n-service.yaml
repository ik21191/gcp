apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-rest-deployment
  labels:
    app: spring-rest-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-rest
  template:
    metadata:
      labels:
        app: spring-rest
    spec:
      containers:
      - name: spring-rest-container
        image: imrankhanin3/spring-rest:latest
        ports:
        - containerPort: 8080
        env:
        - name: DEPLOYED_PLATFORM
          value: Kubernate Cluster
          
---

apiVersion: v1
kind: Service
metadata:
  name: spring-rest-service
  labels:
    app: spring-rest-app
spec:
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 9999
    targetPort: 8080
  selector:
    app: spring-rest