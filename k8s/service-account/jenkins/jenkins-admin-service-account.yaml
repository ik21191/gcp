---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-admin
  namespace: dev

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-admin
  namespace: dev'
  
rules:
#Using below I am giving all resources to all the permissions which we sould avoid in production
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  #To make more strictive permissions
  #- apiGroups: ["*"]
  #  resources: ["deployments", "services", "nodes", "pods"]
  #  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jenkins-admin
subjects:
- kind: ServiceAccount
  name: jenkins-admin
  namespace: dev